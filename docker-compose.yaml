services:
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.0.1
        container_name: elasticsearch
        hostname: elasticsearch
        volumes:
            - ./elasticsearch/elasticsearch.yaml:/usr/share/elasticsearch/config/elasticsearch.yml
            - ./elasticsearch/setup.sh:/usr/share/elasticsearch/setup-elasticsearch.sh
            - ./c:/usr/share/elasticsearch/config/certs
            - ./elasticsearch/i_templates:/usr/share/elasticsearch/i_templates/
            - /var/log/elasticsearch:/usr/share/elasticsearch/logs
        ports:
            - "9200:9200"
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-u",
                    "elastic:${ELASTIC_PASSWORD}",
                    "-f",
                    "https://localhost:9200/_cluster/health",
                    "--cacert",
                    "/usr/share/elasticsearch/config/certs/elastic-ca.pem",
                ]
            interval: 10s
            retries: 5
            timeout: 5s
            start_period: 40s
        networks:
            - efk
        environment:
            CA_PASSWORD: ${CA_PASSWORD}
            CERT_PASSWORD: ${CERT_PASSWORD}
            ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
            KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
            ENV_NAME: ${ENV_NAME}
        command: >
            /bin/bash -c "
                /usr/local/bin/docker-entrypoint.sh &
                /bin/bash /usr/share/elasticsearch/setup-elasticsearch.sh '${ELASTIC_PASSWORD}' '${KIBANA_SYSTEM_PASSWORD}' && 
                wait
            "

    kibana:
        image: docker.elastic.co/kibana/kibana:9.0.1
        container_name: kibana
        hostname: kibana
        depends_on:
            elasticsearch:
                condition: service_healthy
        volumes:
            - ./kibana/kibana.yaml:/usr/share/kibana/config/kibana.yml
            - ./c:/usr/share/kibana/config/certs
        ports:
            - "5601:5601"
        networks:
            - efk
        healthcheck:
            test: ["CMD", "curl", "-f", "https://localhost:5601/", "-k"]
            interval: 10s
            retries: 5
            timeout: 5s
            start_period: 40s
        environment:
            ENV_NAME: ${ENV_NAME}
            KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD}
            CERT_PASSWORD: ${CERT_PASSWORD}

    py:
        container_name: py
        hostname: py
        build: .
        depends_on:
            elasticsearch:
                condition: service_healthy
        networks:
            - efk
        environment:
            PYTHON_APP_USER: ${PYTHON_APP_USER}
            PYTHON_APP_PASSWORD: ${PYTHON_APP_PASSWORD}
            PYTHON_APP_ELASTICSEARCH_ENDPOINT: ${PYTHON_APP_ELASTICSEARCH_ENDPOINT}
            PYTHON_APP_CACERTS: ${PYTHON_APP_CACERTS}
            PYTHON_APP_DATA_HOME_DIR: ${PYTHON_APP_DATA_HOME_DIR}

    fluentd:
        container_name: fluentd
        build: fluentd
        hostname: fluentd
        depends_on:
            elasticsearch:
                condition: service_healthy
        networks:
            - efk
        ports:
            - "24224:24224"
            - "24224:24224/udp"
            - "9880:9880"
        volumes:
            - ./fluentd/conf:/fluentd/etc/
            - ./c/elastic-ca.pem:/fluentd/etc/elastic-ca.pem
        environment:
            FLUENTD_ELASTICSEARCH_PASSWORD: ${FLUENTD_ELASTICSEARCH_PASSWORD}
            FLUENTD_ELASTICSEARCH_USER: ${FLUENTD_ELASTICSEARCH_USER}
            FLUENTD_FLUSH_INTERVAL: ${FLUENTD_FLUSH_INTERVAL}
networks:
    efk:
